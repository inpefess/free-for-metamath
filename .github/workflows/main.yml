on: [push]
jobs:
  verify:
    strategy:
      matrix:
        module: [classical, relevant]
    runs-on: ubuntu-latest
    name: Verify Metamath proof
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify by metamath-knife
        uses: ./.github/actions/verify-by-metamath-knife
        id: verify-by-metamath-knife
        with:
          module-name: ${{ matrix.module }}
          main-file: main.mm
      - name: Verify by mm
        uses: ./.github/actions/verify-by-checkmm
        id: verify-by-checkmm
        with:
          module-name: ${{ matrix.module }}
          main-file: main.mm
      - name: Verify by mmverify.py
        uses: ./.github/actions/verify-by-mmverify-py
        id: verify-by-mmverify-py
        with:
          module-name: ${{ matrix.module }}
          main-file: main.mm
      - name: Verify by metamath-exe
        uses: ./.github/actions/verify-by-metamath-exe
        id: verify-by-metamath-exe
        with:
          module-name: ${{ matrix.module }}
          main-file: main.mm
  build:
    runs-on: ubuntu-latest
    name: Build Metamath proof documentation
    needs: verify
    strategy:
      matrix:
        module: [classical, relevant]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build HTML by metamath-exe
        uses: ./.github/actions/build-html-by-metamath-exe
        id: build-html-by-metamath-exe
        with:
          module-name: ${{ matrix.module }}
          main-file: main.mm
      - name: Build TeX by metamath-exe
        uses: ./.github/actions/build-tex-by-metamath-exe
        id: build-tex-by-metamath-exe
        with:
          module-name: ${{ matrix.module }}
          main-file: main.mm
      - name: Build PDF with TeX Live
        uses: ./.github/actions/build-pdf
        id: build-pdf
        with:
          main-file: ${{ matrix.module }}/build/tex/main.tex
      - name: Archive built HTML
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.module }}-html
          path: ${{ matrix.module }}/build/html
      - name: Archive built PDF
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.module }}-pdf
          path: ${{ matrix.module }}/build/tex/main.pdf
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Get classical HTML
        uses: actions/download-artifact@v8
        with:
          name: classical-html
          path: pages/classical
      - name: Get classical PDF
        uses: actions/download-artifact@v8
        with:
          name: classical-pdf
          path: pages/classical/tex
      - name: Get relevant HTML
        uses: actions/download-artifact@v8
        with:
          name: relevant-html
          path: pages/relevant
      - name: Get relevant PDF
        uses: actions/download-artifact@v8
        with:
          name: relevant-pdf
          path: pages/relevant/tex
      - name: Move PDF files
        run: |
          mv pages/classical/tex/main.pdf pages/classical
          rmdir pages/classical/tex
          mv pages/relevant/tex/main.pdf pages/relevant
          rmdir pages/relevant/tex          
      - name: Upload HTML Build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
