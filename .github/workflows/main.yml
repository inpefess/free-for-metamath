on: [push]
jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify Metamath proof
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify by metamath-knife
        uses: ./.github/actions/verify-by-metamath-knife
        id: verify-by-metamath-knife
        with:
          main-file: 'main.mm'
      - name: Verify by mmcheck
        uses: ./.github/actions/verify-by-checkmm
        id: verify-by-checkmm
        with:
          main-file: 'main.mm'
      - name: Verify by mmverify.py
        uses: ./.github/actions/verify-by-mmverify-py
        id: verify-by-mmverify-py
        with:
          main-file: 'main.mm'
      - name: Verify by metamath-exe
        uses: ./.github/actions/verify-by-metamath-exe
        id: verify-by-metamath-exe
        with:
          main-file: 'main.mm'
  build:
    runs-on: ubuntu-latest
    name: Build Metamath proof documentation
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build HTML by metamath-exe
        uses: ./.github/actions/build-html-by-metamath-exe
        id: build-html-by-metamath-exe
        with:
          main-file: 'main.mm'
      - name: Upload HTML Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/build/html
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
