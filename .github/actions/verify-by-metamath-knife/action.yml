name: Verify by metamath-knife
inputs:
  module-name:
    description: |
      Name of the module to verify. Possible values: classical or relevant.
    required: true
  main-file:
    description: Name of the main Metamath file to verify
    required: true
runs:
  using: docker
  image: docker://ghcr.io/inpefess/verify-by-metamath-knife:latest
  args:
    - ${{ inputs.module-name }}
    - ${{ inputs.main-file }}
